name: dulcenav
description: "DulceNav — Navegador ultra-ligero y seguro del ecosistema Dulce Universe."
version: 1.8.1+1

# ============================================================
# Configuración de publicación
# ============================================================
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

# ============================================================
# DEPENDENCIAS DE PRODUCCIÓN
# ============================================================
dependencies:
  flutter:
    sdk: flutter

  # ── WebView ──────────────────────────────────────────────
  # Android: usa el WebView del sistema (sin motor propio)
  webview_flutter: ^4.10.0
  # Windows: usa Edge/Chromium nativo del sistema
  webview_windows: ^0.4.0

  # ── Estado y Navegación ──────────────────────────────────
  provider: ^6.1.2
  go_router: ^14.2.7
  path: ^1.9.0

  # ── Almacenamiento Local ──────────────────────────────────
  shared_preferences: ^2.3.2
  win32: ^5.15.0
  ffi: ^2.1.2
  # Base de datos local para listas de bloqueo (Fase 2)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3

  # ── WebView Android & Criptografía ───────────────────────
  flutter_inappwebview: ^6.1.5
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.3

  # ── UI / Estilo ───────────────────────────────────────────

  # ── Utilidades ────────────────────────────────────────────
  # Para peticiones HTTP (actualizar listas de bloqueo)
  http: ^1.2.2
  geolocator: ^13.0.1
  local_auth: ^2.3.0
  device_info_plus: ^11.1.0
  system_info2: ^4.0.0
  llama_cpp_dart: ^0.2.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

# ============================================================
# ASSETS
# ============================================================
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/blocklists/






